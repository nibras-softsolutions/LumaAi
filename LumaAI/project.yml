name: LumaAI
options:
  bundleIdPrefix: com.nibrassoftsolutions
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-sandbox"

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

targets:
  LumaAI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LumaAI
    dependencies:
      - package: GoogleSignIn
    info:
      path: LumaAI/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Luma AI"
        UILaunchStoryboardName: "LaunchScreen"
        UISupportedInterfaceOrientations:
          - "UIInterfaceOrientationPortrait"
        NSMicrophoneUsageDescription: "Luma AI uses the microphone for voice conversations with the AI assistant."
        NSSpeechRecognitionUsageDescription: "Luma AI uses speech recognition to transcribe your spoken words in real time."
        GIDClientID: "172474086048-ke3r4ekgdm0vcak48j1bvqqb6msrmubh.apps.googleusercontent.com"
        GIDServerClientID: "172474086048-02bpfth3nc9md882lhc22bkfl2raojpd.apps.googleusercontent.com"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: "GoogleSignIn"
            CFBundleURLSchemes:
              - "com.googleusercontent.apps.172474086048-ke3r4ekgdm0vcak48j1bvqqb6msrmubh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nibrassoftsolutions.LumaAI
        PRODUCT_NAME: LumaAI
        DEVELOPMENT_TEAM: "S9HCF8W2FW"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-sandbox"

  LumaAITests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LumaAITests
    dependencies:
      - target: LumaAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nibrassoftsolutions.LumaAITests
        PRODUCT_NAME: LumaAITests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-sandbox"
